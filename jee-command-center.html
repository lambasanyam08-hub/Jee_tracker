<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>JEE 2027 Command Center</title><meta name="color-scheme" content="light dark">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:wght@500;600&family=Hanken+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f5f7;--cd:#fff;--ink:#151922;--mu:#667085;--ln:#e0e3e9;--ac:#2c4bd0;--g:#1b8553;--y:#9a7406;--o:#c2570c;--r:#c0332a;--b:#2a62c9;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1218;--cd:#171b23;--ink:#e8ebf0;--mu:#8e97a6;--ln:#272d38;--ac:#7b94ff;--g:#4cc38a;--y:#e0b83c;--o:#f08a45;--r:#ff6b60;--b:#6fa3ff}}
:root[data-theme="dark"]{--bg:#0f1218;--cd:#171b23;--ink:#e8ebf0;--mu:#8e97a6;--ln:#272d38;--ac:#7b94ff;--g:#4cc38a;--y:#e0b83c;--o:#f08a45;--r:#ff6b60;--b:#6fa3ff}
*{box-sizing:border-box}html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:15px/1.5 "Hanken Grotesk",system-ui,sans-serif;padding-bottom:calc(120px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{font-family:Newsreader,Georgia,serif;font-weight:600;margin:0}h1{font-size:28px}h2{font-size:20px;margin:28px 0 12px}h3{font-size:17px}
a{color:inherit;text-decoration:none}button,select,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
#top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:10px 16px;display:flex;gap:10px;align-items:center;border-bottom:1px solid var(--ln)}
#top b{font-family:Newsreader,serif;font-size:18px;white-space:nowrap}
input,select,textarea{background:var(--cd);border:1px solid var(--ln);border-radius:8px;padding:8px 10px;width:100%}textarea{min-height:80px}
#main{padding:16px;max-width:1040px;margin:0 auto}
#side{display:none}#bot{position:fixed;left:0;right:0;bottom:0;background:var(--cd);border-top:1px solid var(--ln);display:flex;padding-bottom:env(safe-area-inset-bottom,0px);z-index:6}
#bot a{flex:1;text-align:center;padding:12px 2px;font-size:12px;color:var(--mu)}#bot a.on{color:var(--ac);font-weight:600;box-shadow:inset 0 2px var(--ac)}
#fab{position:fixed;right:16px;bottom:calc(70px + env(safe-area-inset-bottom,0px));z-index:7;background:var(--ac);color:var(--bg);border:0;border-radius:999px;padding:12px 18px;font-weight:600;box-shadow:0 4px 14px rgba(0,0,0,.25);cursor:pointer}
@media(min-width:860px){#side{display:flex;flex-direction:column;gap:2px;position:fixed;top:56px;left:0;bottom:0;width:200px;padding:16px 10px;border-right:1px solid var(--ln)}#side a{padding:8px 12px;border-radius:8px;color:var(--mu)}#side a.on{background:var(--cd);color:var(--ink);font-weight:600;border:1px solid var(--ln)}#bot{display:none}#main{margin-left:200px;max-width:none;padding:24px 32px}#main>*{max-width:1000px}#fab{bottom:24px}body{padding-bottom:80px}}
.card{background:var(--cd);border:1px solid var(--ln);border-radius:12px;padding:14px;display:block}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}.stats{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}
.stat b{display:block;font:600 24px Newsreader,serif}.stat span,.mu,.meta{color:var(--mu);font-size:13px}.meta{display:flex;justify-content:space-between;gap:8px;margin-top:6px}
.bar{height:5px;background:var(--ln);border-radius:9px;margin:10px 0 4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac)}
.hero{display:flex;gap:20px;align-items:center;flex-wrap:wrap;padding:20px}.hero .n{font:600 64px/1 Newsreader,serif}
.bd{display:inline-flex;gap:6px;align-items:center;font-size:12px;font-weight:600}.bd i{width:8px;height:8px;border-radius:50%;background:currentColor}
.strong{color:var(--g)}.stable{color:var(--b)}.revise{color:var(--y)}.weak{color:var(--o)}.critical{color:var(--r)}.none{color:var(--mu)}
.btn{border:1px solid var(--ln);background:var(--cd);border-radius:8px;padding:8px 12px;cursor:pointer;display:inline-block}.btn.p,.pri{background:var(--ac);color:var(--bg);border-color:var(--ac);font-weight:600}.pri{border:0;border-radius:8px;padding:8px 14px;cursor:pointer}.ghost{background:none;border:1px solid var(--ln);border-radius:8px;padding:8px 14px;cursor:pointer}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--ln);margin:16px 0}.tabs a{padding:8px 12px;color:var(--mu);white-space:nowrap}.tabs a.on{color:var(--ink);font-weight:600;border-bottom:2px solid var(--ac)}
.li{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--ln)}.li:last-child{border:0}
.q{font-size:12px;color:var(--mu);margin-top:32px}.pin{float:right;color:var(--y)}
dialog{border:1px solid var(--ln);border-radius:14px;background:var(--cd);color:var(--ink);width:min(440px,94vw);max-height:90vh}dialog::backdrop{background:rgba(0,0,0,.45)}dialog label{display:block;font-size:13px;color:var(--mu);margin-top:10px}dialog .row{margin-top:16px;justify-content:flex-end}.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.empty{padding:24px;text-align:center;color:var(--mu)}.empty .btn{margin-top:10px}
</style></head><body>
<div id="top"><b>JEE 2027</b><input id="q" type="search" placeholder="Search chapters, topics, errors, notes…" aria-label="Search"></div>
<nav id="side" aria-label="Main"></nav><main id="main"></main><nav id="bot" aria-label="Main"></nav>
<button id="fab" data-a="log">+ Log session</button><dialog id="D"></dialog>
<script>
const K='jee27',SUBS=['Physics','Chemistry','Mathematics'],STG=['Learn','Practice','Main PYQs','Advanced PYQs','Revision','Test','Mastered'],TS=['Not started','Learning','Practicing','Weak','Strong','Mastered'],TSC=[0,35,55,15,85,100],ACT=['Lecture','Practice','Main PYQs','Advanced PYQs','Revision','Test','Coaching material','Other'],LV=['Basic','Main','Advanced','Coaching','Other'],ET=['Conceptual','Formula','Calculation','Silly mistake','Misread question','Time management','Guessing','Other'];
const SYL={Physics:[["Units & Measurements","Kinematics","Laws of Motion","Work, Energy & Power","Rotational Motion","Gravitation","Properties of Solids & Liquids","Thermodynamics","Kinetic Theory of Gases","Oscillations & Waves"],["Electrostatics","Current Electricity","Magnetism & Moving Charges","EMI & Alternating Current","Electromagnetic Waves","Optics","Dual Nature of Matter","Atoms & Nuclei","Electronic Devices","Experimental Skills"]],
Chemistry:[["Some Basic Concepts","Atomic Structure","Chemical Bonding","Chemical Thermodynamics","Chemical Equilibrium","Ionic Equilibrium","Redox Reactions","Periodic Table & Periodicity","Hydrocarbons","General Organic Chemistry"],["Solutions","Electrochemistry","Chemical Kinetics","d & f Block Elements","Coordination Compounds","p-Block Elements","Haloalkanes & Haloarenes","Alcohols, Phenols & Ethers","Aldehydes, Ketones & Acids","Amines","Biomolecules & Polymers","Everyday Chemistry & Practical"]],
Mathematics:[["Sets, Relations & Functions","Complex Numbers","Quadratic Equations","Sequences & Series","Permutations & Combinations","Binomial Theorem","Trigonometry","Straight Lines","Circles","Conic Sections","Statistics"],["Matrices & Determinants","Limits & Continuity","Differentiability & Derivatives","Applications of Derivatives","Integral Calculus","Differential Equations","Vector Algebra","3D Geometry","Probability","Mathematical Reasoning"]]};
const ST={strong:'Strong',stable:'Stable',revise:'Needs revision',weak:'Weak',critical:'Critical',none:'Not enough data'};
const T=()=>{const d=new Date();return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)},dd=(a,b)=>Math.round((new Date(a)-new Date(b))/864e5),uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),fm=m=>`${m/60|0}h ${Math.round(m%60)}m`,pc=v=>v==null?'–':Math.round(v)+'%',$=s=>document.querySelector(s),rel=d=>{const n=dd(d,T());return n==0?'today':n>0?`in ${n}d`:`${-n}d ago`};
const defS=()=>({v:1,ch:SUBS.flatMap(s=>[0,1].flatMap(i=>SYL[s][i].map((n,j)=>({id:s[0]+(11+i)+'-'+j,s,k:11+i,n,pin:false,prio:'normal',tp:[],stg:{},rev:[],ov:'',note:'',skip:false})))),ses:[],err:[],set:{theme:'auto',exam:'2027-01-22',fg:14,th:[80,65,50,35],w:{acc:40,adv:20,top:25,rev:15}}});
let S;try{S=JSON.parse(localStorage.getItem(K))}catch(e){}if(!S||!S.ch)S=defS();
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
let M={},Q='',F={s:'',k:''};
function stats(){const m={},st=S.set;S.ch.forEach(c=>m[c.id]={min:0,q:0,c:0,mq:0,mc:0,aq:0,ac:0,last:null});
S.ses.forEach(s=>{const x=m[s.ch];if(!x)return;x.min+=s.min;x.q+=s.q;x.c+=s.c;if(s.lv=='Main'){x.mq+=s.q;x.mc+=s.c}if(s.lv=='Advanced'){x.aq+=s.q;x.ac+=s.c}if(!x.last||s.d>x.last)x.last=s.d});
S.ch.forEach(c=>{const x=m[c.id],w=st.w,p=[];x.acc=x.q?x.c/x.q*100:null;x.ma=x.mq?x.mc/x.mq*100:null;x.aa=x.aq?x.ac/x.aq*100:null;x.comp=Math.round(STG.filter(g=>c.stg[g]).length/STG.length*100);
if(x.acc!=null)p.push([x.acc,w.acc]);if(x.aa!=null)p.push([x.aa,w.adv]);if(c.tp.length)p.push([c.tp.reduce((a,t)=>a+TSC[t.s],0)/c.tp.length,w.top]);const dr=c.rev.filter(r=>r.done).length;if(dr)p.push([Math.min(dr/3,1)*100,w.rev]);
const tw=p.reduce((a,b)=>a+b[1],0);x.mast=tw?Math.round(p.reduce((a,b)=>a+b[0]*b[1],0)/tw):null;const t=st.th;
x.st=c.ov||(x.q<10||x.mast==null?'none':x.mast>=t[0]?'strong':x.mast>=t[1]?'stable':x.mast>=t[2]?'revise':x.mast>=t[3]?'weak':'critical');x.ago=x.last?dd(T(),x.last):null});return m}
const badge=k=>`<span class="bd ${k}"><i></i>${ST[k]}</span>`,ring=(p,z=84)=>{const r=z/2-6,L=2*Math.PI*r;return `<svg width="${z}" height="${z}" role="img" aria-label="${p} percent"><circle cx="${z/2}" cy="${z/2}" r="${r}" fill="none" stroke="var(--ln)" stroke-width="6"/><circle cx="${z/2}" cy="${z/2}" r="${r}" fill="none" stroke="var(--ac)" stroke-width="6" stroke-linecap="round" stroke-dasharray="${L*p/100} ${L}" transform="rotate(-90 ${z/2} ${z/2})"/><text x="50%" y="54%" text-anchor="middle" fill="currentColor" font-size="${z/4.5}" font-weight="600">${p}%</text></svg>`};
const stat=(v,l)=>`<div class="card stat"><b>${v}</b><span>${l}</span></div>`,empty=(t,b)=>`<div class="card empty">${t}<br>${b||''}</div>`;
const card=c=>{const x=M[c.id];return `<a class="card" href="#/ch/${c.id}"><b>${esc(c.n)}</b>${c.pin?'<span class="pin" aria-label="Pinned">★</span>':''}<div class="bar"><i style="width:${x.comp}%"></i></div><div class="meta"><span>${x.comp}% complete</span><span>${pc(x.mast)} mastery</span></div><div class="meta"><span>${fm(x.min)}</span><span>${x.q} Q · ${pc(x.acc)}</span></div><div class="meta">${badge(x.st)}<span>${x.ago==null?'Not studied':x.ago+'d ago'}</span></div></a>`};
const chn=id=>S.ch.find(c=>c.id==id);
function focus(){const o=[];S.ch.forEach(c=>{const x=M[c.id];let sc=0,w='';if(c.rev.some(r=>!r.done&&r.d<T())){sc+=50;w='Revision overdue'}
if(x.st=='critical'){sc+=40;w=w||'Critical: rebuild weak topics'}else if(x.st=='weak'){sc+=30;w=w||'Weak: more practice'}else if(x.st=='revise'){sc+=20;w=w||'Needs revision'}
if(x.ago!=null&&x.ago>=S.set.fg){sc+=15;w=w||`Untouched for ${x.ago} days`}if(c.prio=='high'){sc+=10;w=w||'High priority'}if(sc)o.push({c,sc,w})});return o.sort((a,b)=>b.sc-a.sc).slice(0,5)}
function home(){const cs=S.ch,mm=cs.map(c=>M[c.id].mast).filter(v=>v!=null),min=S.ses.reduce((a,s)=>a+s.min,0),q=S.ses.reduce((a,s)=>a+s.q,0),cr=S.ses.reduce((a,s)=>a+s.c,0),comp=Math.round(cs.reduce((a,c)=>a+M[c.id].comp,0)/cs.length),ms=cs.filter(c=>c.stg.Mastered).length,att=cs.filter(c=>['weak','critical'].includes(M[c.id].st)).length,days=dd(S.set.exam,T()),f=focus(),pins=cs.filter(c=>c.pin),fg=cs.filter(c=>M[c.id].ago!=null&&M[c.id].ago>=S.set.fg);
return `<div class="card hero"><div><div class="n">${days>0?days:0}</div><div class="mu">days to JEE Main (${esc(S.set.exam)}, editable in Settings)</div></div><div style="margin-left:auto">${ring(comp)}</div></div>
<div class="grid stats" style="margin-top:12px">${stat(pc(mm.length?mm.reduce((a,b)=>a+b,0)/mm.length:null),'Overall mastery')}${stat(fm(min),'Total study time')}${stat(q,'Questions')}${stat(pc(q?cr/q*100:null),'Accuracy')}${stat(ms+' / '+cs.length,'Chapters mastered')}${stat(att,'Need attention')}</div>
<div class="row" style="margin-top:14px"><button class="btn p" data-a="log">+ Log session</button><button class="btn" data-a="err">+ Add error</button><a class="btn" href="#/rev">Start revision</a></div>
<h2>Today's focus</h2><div class="card">${f.length?f.map(z=>`<a class="li" href="#/ch/${z.c.id}"><span><b>${esc(z.c.n)}</b><br><span class="mu">${z.w}</span></span>${badge(M[z.c.id].st)}</a>`).join(''):`<div class="empty">Nothing flagged yet. Log a session or pin a chapter to get started.</div>`}</div>
<h2>Pinned chapters</h2>${pins.length?`<div class="grid">${pins.map(card).join('')}</div>`:empty('No pinned chapters yet.','Open a chapter and tap ★ Pin.')}
${fg.length?`<h2>Forgotten</h2><div class="card">${fg.map(c=>`<a class="li" href="#/ch/${c.id}"><span>${esc(c.n)}</span><span class="mu">${M[c.id].ago} days since last session</span></a>`).join('')}</div>`:''}
<p class="q">NO PLAN B. JUST IIT B.</p>`}
function sub(s){const cs=S.ch.filter(c=>c.s==s),t=cs.reduce((a,c)=>(a.min+=M[c.id].min,a.q+=M[c.id].q,a.c+=M[c.id].c,a),{min:0,q:0,c:0}),mm=cs.map(c=>M[c.id].mast).filter(v=>v!=null);
return `<h1>${s}</h1><div class="grid stats" style="margin-top:12px">${stat(Math.round(cs.reduce((a,c)=>a+M[c.id].comp,0)/(cs.length||1))+'%','Completion')}${stat(pc(mm.length?mm.reduce((a,b)=>a+b,0)/mm.length:null),'Mastery')}${stat(fm(t.min),'Study time')}${stat(t.q,'Questions')}${stat(pc(t.q?t.c/t.q*100:null),'Accuracy')}${stat(cs.filter(c=>['weak','critical'].includes(M[c.id].st)).length,'Weak chapters')}</div>`+[11,12].map(k=>`<h2>Class ${k}</h2><div class="grid">${cs.filter(c=>c.k==k).map(card).join('')||empty('No chapters here yet.')}</div>`).join('')}
const tabs=[['ov','Overview'],['tp','Topics'],['ss','Sessions'],['er','Errors'],['rv','Revision'],['tt','Test prep']];
function chp(id,t){const c=chn(id);if(!c)return empty('Chapter not found.','<a class="btn" href="#/home">Home</a>');const x=M[id];
let b='';const ses=S.ses.filter(s=>s.ch==id).sort((a,b)=>b.d.localeCompare(a.d)),er=S.err.filter(e=>e.ch==id),nr=c.rev.filter(r=>!r.done).sort((a,b)=>a.d.localeCompare(b.d))[0],lr=c.rev.filter(r=>r.done).sort((a,b)=>b.d.localeCompare(a.d))[0];
if(t=='ov')b=`<div class="grid stats">${stat(x.comp+'%','Completion')}${stat(pc(x.mast),'Mastery')}${stat(fm(x.min),'Time invested')}${stat(x.q,'Questions')}${stat(pc(x.acc),'Accuracy')}${stat(pc(x.ma),'JEE Main accuracy')}${stat(pc(x.aa),'Advanced accuracy')}${stat(x.ago==null?'Never':x.ago+'d ago','Last studied')}</div>
<h2>Learning pipeline</h2><div class="card">${STG.map(g=>`<label class="li"><span>${g}</span><input type="checkbox" style="width:auto" data-a="stg" data-c="${id}" data-g="${g}" ${c.stg[g]?'checked':''}></label>`).join('')}</div>
<h2>Settings for this chapter</h2><div class="two"><label class="mu">Status override<select data-ch="${id}" data-f="ov"><option value="">Automatic (${ST[x.st]})</option>${Object.keys(ST).map(k=>`<option value="${k}" ${c.ov==k?'selected':''}>${ST[k]}</option>`).join('')}</select></label><label class="mu">Priority<select data-ch="${id}" data-f="prio"><option value="normal">Normal</option><option value="high" ${c.prio=='high'?'selected':''}>High</option></select></label></div>
<label class="mu">Notes and formulas<textarea data-ch="${id}" data-f="note">${esc(c.note)}</textarea></label><p><button class="btn" data-a="del" data-c="${id}">Delete chapter</button></p>`;
if(t=='tp')b=`<div class="card">${c.tp.length?c.tp.map((p,i)=>`<div class="li"><span>${esc(p.n)}</span><span class="row"><button class="btn" data-a="tcy" data-c="${id}" data-i="${i}" aria-label="Change status">${TS[p.s]}</button><button class="ghost" data-a="tdel" data-c="${id}" data-i="${i}" aria-label="Remove topic">✕</button></span></div>`).join(''):'<div class="empty">No topics yet. Add the concepts inside this chapter to see where you are weak.</div>'}</div><p><button class="btn p" data-a="tadd" data-c="${id}">+ Add topic</button></p>`;
if(t=='ss')b=`<p><button class="btn p" data-a="log" data-c="${id}">+ Log session</button></p><div class="card">${ses.length?ses.slice(0,100).map(s=>`<div class="li"><span><b>${s.act}</b> · ${s.d} · ${fm(s.min)}${s.q?` · ${s.c}/${s.q} ${s.lv}`:''}<br><span class="mu">${esc(s.n)}</span></span><button class="ghost" data-a="dses" data-i="${s.id}" aria-label="Delete session">✕</button></div>`).join(''):'<div class="empty">No study sessions yet.</div>'}</div>`;
if(t=='er'){const cnt={};er.forEach(e=>cnt[e.ty]=(cnt[e.ty]||0)+1);const top=Object.entries(cnt).sort((a,b)=>b[1]-a[1])[0];b=`${top?`<p class="card">Most common error here: <b>${top[0]}</b> (${top[1]} of ${er.length}).</p>`:''}<p><button class="btn p" data-a="err" data-c="${id}">+ Add error</button></p><div class="card">${er.length?er.map(e=>`<div class="li"><span><b>${esc(e.ref)||'Error'}</b> · ${e.ty} · ${e.d}<br><span class="mu">${esc(e.ex)}${e.fx?' → '+esc(e.fx):''}</span></span><span class="row"><button class="btn" data-a="efix" data-i="${e.id}">${e.fixed?'Fixed ✓':'Not fixed'}</button><button class="ghost" data-a="derr" data-i="${e.id}" aria-label="Delete error">✕</button></span></div>`).join(''):'<div class="empty">No errors logged. Add one when you get something wrong.</div>'}</div>`}
if(t=='rv')b=`<div class="row"><button class="btn p" data-a="radd" data-c="${id}">+ Schedule revision</button><button class="btn" data-a="rsug" data-c="${id}">Suggest spaced dates</button></div><div class="card" style="margin-top:12px">${c.rev.length?c.rev.slice().sort((a,b)=>a.d.localeCompare(b.d)).map((r,i)=>`<div class="li"><span>R${i+1} · ${r.d} (${rel(r.d)})</span><span class="row">${rb(r)}${r.done?'':`<button class="btn" data-a="rdone" data-c="${id}" data-i="${r.id}">Mark done</button>`}<button class="ghost" data-a="rdel" data-c="${id}" data-i="${r.id}" aria-label="Delete">✕</button></span></div>`).join(''):'<div class="empty">No revisions scheduled. Dates are suggestions only. Set your own.</div>'}</div>`;
